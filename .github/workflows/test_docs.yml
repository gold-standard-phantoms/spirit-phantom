name: Test Documentation Builds

on:
  push:
    branches:
      - "**"

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Check if documentation can be built
        run: uv run mkdocs build -s