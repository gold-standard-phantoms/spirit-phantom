# Publishes the documentation to two places, each built separately because site_url differs
# (mkdocs.yaml reads it from SITE_URL):
#   docs   the GSP documentation server, http://docs.internal/spirit-phantom/
#          main publishes "dev"; a tag vX.Y.Z publishes "X.Y.Z" and moves "latest"
#   pages  GitHub Pages, https://gold-standard-phantoms.github.io/spirit-phantom/
#          main only

name: Documentation

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    uses: gold-standard-phantoms/github-actions/.github/workflows/deploy-docs.yml@v0.6.0
    with:
      project: spirit-phantom
      python_version: "3.11"
      use_private_pypi: false
    secrets:
      GSP_DOCS_KEY: ${{ secrets.GSP_DOCS_KEY }}

  pages:
    if: github.ref == 'refs/heads/main'
    uses: gold-standard-phantoms/github-actions/.github/workflows/deploy-pages.yml@v0.6.0
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      python_version: "3.11"
      use_private_pypi: false
